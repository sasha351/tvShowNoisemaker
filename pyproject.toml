[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvshow-noisemaker"
version = "1.0.0"
description = "CLI tool: trim intro/outro from TV show video episodes and export .mp3 files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "static-ffmpeg>=3.0",
]

[project.scripts]
tvshow-noisemaker = "tvshow_noisemaker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tvshow_noisemaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
