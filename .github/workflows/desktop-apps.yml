name: Desktop apps

# Pushing a vX.Y.Z tag (tools/release.sh does) builds the installers and publishes the GitHub
# Release the installed apps update from: a .dmg per Mac CPU and a Setup.exe for Windows.
# Each Mac CPU also gets a .zip of the app, the only thing 2.2.0's updater can install.
# Changes to the packaging are build-checked on any branch.
on:
  push:
    tags: ["v*.*.*"]
    branches: ["**"]
    paths:
      - "packaging/**"
      - "tools/build_*_app.sh"
      - ".github/workflows/desktop-apps.yml"
      - "pyproject.toml"
      - "tvshow_noisemaker/**"
      - "tests/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
            extras: dev,stft
            pytest_args: ""
          - runner: macos-15-intel  # Intel: librosa's llvmlite has no Intel-Mac wheels, skip its tests
            arch: x86_64
            extras: dev
            pytest_args: -k "not stft_fallback"
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' tvshow_noisemaker/__init__.py)"
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME but __version__ is $version"; exit 1; }

      - name: Tests
        run: |
          python -m pip install --quiet -e ".[${{ matrix.extras }}]"
          python -m pytest -q ${{ matrix.pytest_args }}

      - name: Build app and disk image
        run: PYTHON=python tools/build_macos_app.sh

      - name: Smoke test the built app
        run: |
          report="$RUNNER_TEMP/smoke.txt"
          TVSN_NO_UPDATE=1 TVSN_SMOKE_REPORT="$report" \
            "dist/TV Show Noisemaker.app/Contents/MacOS/TV Show Noisemaker" &
          pid=$!
          for _ in $(seq 1 60); do [[ -s "$report" ]] && break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          cat "$report"
          if grep -q MISSING "$report"; then exit 1; fi
          file "dist/TV Show Noisemaker.app/Contents/MacOS/TV Show Noisemaker" | grep -q "${{ matrix.arch }}"

      - name: Update path (copy app out of the dmg, swap bundle in place)
        run: |
          apps="$RUNNER_TEMP/Applications"
          mkdir -p "$apps"
          ditto "dist/TV Show Noisemaker.app" "$apps/TV Show Noisemaker.app"
          echo stale > "$apps/TV Show Noisemaker.app/Contents/stale-marker"
          python - "$apps/TV Show Noisemaker.app" <<'PY'
          import subprocess, sys, tempfile
          from pathlib import Path
          from tvshow_noisemaker import appupdate
          work = Path(tempfile.mkdtemp())
          new = appupdate.unpack(Path("dist") / appupdate.asset_name(), work / "new")
          (work / "swap.sh").write_text(appupdate.SWAP_SCRIPT)
          dead = subprocess.Popen(["true"]); dead.wait()  # an app that already quit
          subprocess.run(["/bin/bash", str(work / "swap.sh"), str(dead.pid), str(new), sys.argv[1], str(work)],
                         check=True, timeout=60)
          assert not work.exists()
          PY
          app="$apps/TV Show Noisemaker.app"
          [[ ! -e "$app/Contents/stale-marker" ]]
          codesign --verify --deep --strict "$app"
          sleep 5; pkill -f "$apps/TV Show Noisemaker.app" || true

      - name: Legacy zip unpacks the way the 2.2.0 updater does it
        run: |
          out="$RUNNER_TEMP/legacy-zip"
          ditto -x -k "dist/TV-Show-Noisemaker-macOS-${{ matrix.arch }}.zip" "$out"
          [[ -d "$out/TV Show Noisemaker.app/Contents/MacOS" ]]
          codesign --verify --deep --strict "$out/TV Show Noisemaker.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (updater)
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m pytest -q tests/test_appupdate.py

      - name: Build installer
        run: PYTHON=python tools/build_windows_app.sh

      - name: Smoke test the built app
        run: |
          report="$RUNNER_TEMP/smoke.txt"
          TVSN_NO_UPDATE=1 TVSN_SMOKE_REPORT="$(cygpath -w "$report")" "dist/TV Show Noisemaker/TV Show Noisemaker.exe" &
          for _ in $(seq 1 90); do [[ -s "$report" ]] && break; sleep 1; done
          taskkill //F //IM "TV Show Noisemaker.exe" >/dev/null 2>&1 || true
          cat "$report"
          if grep -q MISSING "$report"; then exit 1; fi

      - name: Install, launch, upgrade over the running app, uninstall
        env:
          TVSN_NO_UPDATE: "1"
        run: |
          setup="dist/TV-Show-Noisemaker-Windows-x64-Setup.exe"
          dir="$RUNNER_TEMP/TVSN"
          windir="$(cygpath -w "$dir")"
          # Fresh install (the installer starts the app when done, as after an in-app update).
          "$setup" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART "//DIR=$windir"
          [[ -f "$dir/TV Show Noisemaker.exe" && -f "$dir/unins000.exe" ]]
          echo stale > "$dir/_internal/stale-marker"
          sleep 5
          tasklist | grep -i "TV Show Noisemaker" || { echo "::error::app did not start after install"; exit 1; }
          # What the in-app updater runs: silent, closes the running app, reopens it.
          "$setup" //SILENT //SUPPRESSMSGBOXES //NORESTART //CLOSEAPPLICATIONS "//DIR=$windir"
          [[ ! -e "$dir/_internal/stale-marker" ]]
          # The installed copy works.
          taskkill //F //IM "TV Show Noisemaker.exe" >/dev/null 2>&1 || true
          report="$RUNNER_TEMP/installed.txt"
          TVSN_SMOKE_REPORT="$(cygpath -w "$report")" "$dir/TV Show Noisemaker.exe" &
          for _ in $(seq 1 90); do [[ -s "$report" ]] && break; sleep 1; done
          taskkill //F //IM "TV Show Noisemaker.exe" >/dev/null 2>&1 || true
          cat "$report"
          if grep -q MISSING "$report"; then exit 1; fi
          # Clean uninstall.
          "$dir/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          for _ in $(seq 1 30); do [[ ! -e "$dir/TV Show Noisemaker.exe" ]] && break; sleep 1; done
          [[ ! -e "$dir/TV Show Noisemaker.exe" ]]

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          # A release made on github.com ("Draft a new release") already exists: just attach the files.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
          fi
